let catF="",heroPh="",pendCake=(location.hash.match(/^#cake-([a-z0-9]+)$/)||[])[1]||"";window.addEventListener("hashchange",()=>{const m=location.hash.match(/^#cake-([a-z0-9]+)$/);if(m){pendCake=m[1];if(view==="shop"&&profile)render()}});
function tiles(){return '<h2 class="sec">Shop by flavour</h2><div class="strip">'+Object.keys(CATS).map(k=>{const L=cakes.filter(c=>c.cat===k),ph=L.find(c=>c.photo);return `<button class="tile ${catF===k?"on":""}" data-cat="${k}"><div class="tp">${ph?`<img src="${ph.photo}" alt="">`:CATS[k].s}</div><b>${CATS[k].n} Cake</b><span class="mu">${L.length} cake${L.length===1?"":"s"}</span></button>`}).join("")+'</div>'}
let tto;const toast=m=>{const t=$("#tt");t.textContent=m;t.style.display="block";clearTimeout(tto);tto=setTimeout(()=>t.style.display="none",3500)};
function modal(html){const o=document.createElement("div");o.className="ov";o.innerHTML='<div class="card">'+html+'</div>';document.body.appendChild(o);o.close=()=>o.remove();return o}
function ask(msg){return new Promise(res=>{const o=modal(`<p>${esc(msg)}</p><div class="row"><button id="no">Cancel</button><button class="p" id="yes">Yes</button></div>`);o.querySelector("#no").onclick=()=>{o.close();res(false)};o.querySelector("#yes").onclick=()=>{o.close();res(true)}})}
function shrink(file){return new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);let q=.8,o=c.toDataURL("image/jpeg",q);while(o.length>200000&&q>.4){q-=.1;o=c.toDataURL("image/jpeg",q)}res(o)};im.onerror=rej;im.src=u})}
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

 a.innerHTML=`<h2 style="margin-top:0">My Orders</h2>`+(myOrders.length?myOrders.sort((x,y)=>y.ts-x.ts).map(o=>`<div class="card item"><div class="row"><b>${esc(o.cakeName)} · ${o.qty||1} × ${o.kg} kg</b><span class="tag">${o.status==="completed"?"Completed ✅":"Pending ⏳"}</span></div><div class="mu">${inr(o.total)} · Needed on: ${esc(o.needDate)}${o.note?"<br>Note: "+esc(o.note):""}</div></div>`).join(""):`<div class="card">You have not placed any orders yet.</div>`);
}
function renderFeedback(a){
 a.innerHTML=`<div class="card box"><h2 style="margin-top:0">Send feedback</h2><label>Your message</label><textarea id="m" rows="4"></textarea><button class="p" id="sf" style="margin-top:10px;width:100%">Send to owner</button></div>`;
 $("#sf").onclick=async()=>{const m=$("#m").value.trim();if(!m)return;
  try{await S.mapSet("feedback",myKey(),"items",uuid(),{name:profile.name,email:profile.email,msg:m,ts:Date.now()});$("#m").value="";toast("Thank you for your feedback!")}catch(e){toast("Could not send feedback ("+((e&&e.code)||"error")+").")}};
}
// ---- owner ----
function renderOwner(a){
 if(!isOwner){
  a.innerHTML=`<div class="card box"><h2 style="margin-top:0">Owner login</h2><label>Email</label><input id="oe" type="email" autocomplete="username"><label>Password</label><input id="op" type="password" autocomplete="current-password"><p id="oerr" class="mu" style="color:var(--no)"></p><button class="p" id="ol" style="width:100%">Login</button></div>`;
  $("#ol").onclick=async()=>{const em=$("#oe").value.trim().toLowerCase(),pw=$("#op").value;
   if(mode==="online"){try{await FB.signInWithEmailAndPassword(FB.auth,em,pw);if(em!==OWNER_EMAIL.toLowerCase()){await FB.signOut(FB.auth);throw 0}}catch(e){$("#oerr").textContent="Wrong email or password."}return}
   const h=await sha(em+":"+pw);if(OWNER_HASHES.includes(h)){isOwner=true;render()}else $("#oerr").textContent="Wrong email or password."};
  return;
 }
 const vis=allOrders.filter(o=>o.ts>resetAt);const pend=vis.filter(o=>o.status!=="completed").sort((x,y)=>y.ts-x.ts);
 const done=vis.filter(o=>o.status==="completed");
 const sales=done.reduce((s,o)=>s+o.total,0);
 a.innerHTML=`<div class="row"><h2 style="margin:0">Owner dashboard</h2><div><button id="af">All feedback (${feedback.length})</button> <button class="d" id="rs">Reset dashboard</button> <button id="lo">Owner logout</button></div></div>
 <div class="banner" style="margin-top:12px;${dbErr||mode!=="online"?"border-color:var(--no);color:var(--no)":""}">${mode==="online"?"Online \u00b7 signed in as "+esc(fbUser&&fbUser.email||"")+" \u00b7 orders received: "+allOrders.length+" \u00b7 feedback: "+feedback.length:"DEMO MODE: Firebase is not connected, so orders from other phones cannot reach you."}${dbErr?" \u00b7 Database error: "+esc(dbErr)+(dbErr==="permission-denied"?" (publish firestore.rules, and check the owner email is the same in index.html and in the rules)":""):""}</div><div class="stats" style="margin-top:12px"><div class="card stat"><span class="mu">Cakes listed</span><b>${cakes.length}</b></div><div class="card stat"><span class="mu">Total sales</span><b>${inr(sales)}</b></div><div class="card stat"><span class="mu">Pending orders</span><b>${pend.length}</b></div><div class="card stat"><span class="mu">Completed orders</span><b>${done.length}</b></div></div>
 <h2>Home page banner photo</h2><div class="card"><div class="mu">Upload a real cake photo to show in the welcome banner.</div><input id="hf" type="file" accept="image/*" style="margin-top:8px"><div class="row" style="margin-top:10px;justify-content:flex-start"><button class="p" id="hs">Save banner photo</button><button class="d" id="hr">Use default banner photo</button></div></div><h2>Add a cake</h2><div class="card"><div class="row"><input id="cn" placeholder="Cake name" style="flex:2"><input id="cp" type="number" min="1" placeholder="Price per kg ₹" style="flex:1"></div><label>Flavour category</label><select id="cc"><option value="strawberry">Strawberry flavour</option><option value="chocolate">Chocolate flavour</option><option value="vanilla">Vanilla flavour</option></select><label>Cake photo</label><input id="cf" type="file" accept="image/*"><label>Available kg (tap to switch on or off)</label><div class="kgrow" id="addkg">${KG_OPTS.map(k=>`<button type="button" class="kc on" data-k="${k}">${k} kg</button>`).join("")}</div><input id="cd" placeholder="Short description" style="margin-top:8px"><button class="p" id="ac" style="margin-top:8px">Add cake</button></div>
 <h2>Your cakes</h2>`+(cakes.length?cakes.map(c=>`<div class="card item row"><div>${c.photo?`<img src="${c.photo}" alt="" style="width:64px;height:64px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-right:8px">`:""}<b>${esc(c.name)}</b> <span class="tag">${CATS[c.cat]?CATS[c.cat].n:"No category"}</span> ${c.soldOut?'<span class="tag s">Sold out</span>':""}<div class="mu">${inr(c.price)}/kg ${esc(c.desc||"")}</div></div><div style="width:100%"><div class="mu">Kg available (tap to switch on or off):</div><div class="kgrow">${KG_OPTS.map(k=>`<button type="button" class="kc ${kgOf(c).includes(k)?"on":""}" data-kcid="${c.id}" data-k="${k}">${k} kg</button>`).join("")}</div></div><div><button data-ed="${c.id}">Edit</button> <button data-so="${c.id}">${c.soldOut?"Back in stock":"Mark sold out"}</button> <button class="d" data-dc="${c.id}">Delete</button></div></div>`).join(""):`<div class="card mu">No cakes yet.</div>`)+
 `<h2>Pending orders</h2>`+(pend.length?pend.map(o=>`<div class="card item row"><div><b>${esc(o.cakeName)} · ${o.qty||1} cake(s) × ${o.kg} kg</b> · ${inr(o.total)}<div class="mu"><b>Needed on: ${esc(o.needDate)}</b>${o.note?"<br>Message: "+esc(o.note):""}<br>${esc(o.name)} · ${esc(o.phone)} · ${esc(o.email)}<br>${esc(o.address)}, ${esc(o.pin)}</div></div><div><button class="g" data-co="${o.id}">Complete order</button> <button class="d" data-do="${o.id}">Delete</button></div></div>`).join(""):`<div class="card mu">No pending orders.</div>`);
 const run=async fn=>{try{await fn()}catch(e){toast("Action failed ("+((e&&e.code)||"error")+"). Please log in again as owner.")}};
 $("#rs").onclick=()=>{const m=modal(`<h3 style="margin-top:0">Reset dashboard</h3><p class="mu">This clears the owner dashboard: sales, orders list and feedback. Your cakes stay, and customers' own accounts and order history are not changed. Enter the owner password to continue.</p><input id="rp" type="password" placeholder="Owner password" autocomplete="current-password"><p id="re" class="mu" style="color:var(--no)"></p><div class="row"><button id="rc">Cancel</button><button class="d" id="rg">Reset now</button></div>`);m.querySelector("#rc").onclick=()=>m.close();m.querySelector("#rg").onclick=async()=>{const pw=m.querySelector("#rp").value;if(!(await verifyOwner(pw)))return m.querySelector("#re").textContent="Wrong password.";try{await S.set("meta","reset",{at:Date.now()});m.close();toast("Dashboard reset done.")}catch(e){m.querySelector("#re").textContent="Reset failed. Make sure you are signed in as the page owner/editor."}}};
 $("#lo").onclick=()=>{if(mode==="online")FB.signOut(FB.auth);else{isOwner=false;render()}};
 $("#hs").onclick=async()=>{const f=$("#hf").files[0];if(!f)return toast("Choose a photo first.");let ph;try{ph=await shrink(f)}catch(e){return toast("Could not read this photo.")}run(async()=>{await S.set("meta","hero",{photo:ph});toast("Banner photo saved!")})};
 $("#hr").onclick=()=>run(async()=>{await S.set("meta","hero",{photo:""});toast("Default banner photo restored.")});
 $("#ac").onclick=async()=>{const n=$("#cn").value.trim(),p=Number($("#cp").value),f=$("#cf").files[0];if(!n||!(p>0))return toast("Enter a cake name and a valid price.");let photo="";if(f){try{photo=await shrink(f)}catch(e){return toast("Could not read this photo.")}}run(async()=>{await S.set("cakes",uuid(),{name:n,price:p,desc:$("#cd").value.trim(),cat:$("#cc").value,photo,kgs:[...document.querySelectorAll("#addkg .kc.on")].map(b=>parseFloat(b.dataset.k)),soldOut:false,ts:Date.now()});toast("Cake added!")})};
 a.querySelectorAll("[data-so]").forEach(b=>b.onclick=()=>{const c=cakes.find(x=>x.id===b.dataset.so);const {id,...r}=c;run(()=>S.set("cakes",id,{...r,soldOut:!c.soldOut}))});
 a.querySelectorAll("[data-dc]").forEach(b=>b.onclick=async()=>{if(await ask("Delete this cake?"))run(()=>S.del("cakes",b.dataset.dc))});
 a.querySelectorAll("[data-co]").forEach(b=>b.onclick=()=>run(()=>updOrder(b.dataset.co,o=>({...o,status:"completed"}))));
 a.querySelectorAll("[data-do]").forEach(b=>b.onclick=async()=>{if(await ask("Delete this order?"))run(()=>updOrder(b.dataset.do,null))});
 $("#af").onclick=()=>showFb(run);
 a.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>editCake(cakes.find(x=>x.id===b.dataset.ed),run));
 $("#addkg").querySelectorAll(".kc").forEach(b=>b.onclick=()=>b.classList.toggle("on"));
 a.querySelectorAll("[data-kcid]").forEach(b=>b.onclick=()=>{const c=cakes.find(x=>x.id===b.dataset.kcid),k=parseFloat(b.dataset.k),cur=kgOf(c),nk=cur.includes(k)?cur.filter(x=>x!==k):cur.concat([k]);const {id,...r}=c;run(()=>S.set("cakes",id,{...r,kgs:nk.sort((x,y)=>x-y)}))});
}
// ---- subscriptions ----
const flat=(docs,f)=>docs.flatMap(d=>Object.entries(d[f]||{}).map(([id,v])=>({...v,id,key:d.id})));
function recompute(){allOrders=flat(idxDocs,"orders");myOrders=allOrders.filter(o=>o.key===myKey()&&(!profile||o.email===profile.email));feedback=flat(fbDocs,"items").filter(f=>f.ts>resetAt);if(view==="orders"||(view==="owner"&&isOwner))render()}
async function updOrder(id,fn){const o=allOrders.find(x=>x.id===id);const {id:_i,key:_k,...orig}=o;await S.mapSet("orderIndex",o.key,"orders",id,fn?fn(orig):null)}
(async function init(){
 render();
 try{
  const c=window.FIREBASE_CONFIG||{},ok=!!c.apiKey&&!/^PASTE/.test(c.apiKey);
  if(ok&&!window.FB&&!window.FBDONE)await new Promise(r=>{["fb-ready","fb-fail"].forEach(ev=>window.addEventListener(ev,r,{once:true}));setTimeout(r,15000)});
  window.addEventListener("fb-ready",()=>{if(mode==="local")location.reload()});
  mode=ok&&window.FB?"online":"local";
  booting=false;
  if(mode==="local")profile=lsGet(pk("profile"),null);
  banner();
  S.sub("cakes",l=>{cakes=l.sort((x,y)=>(x.ts||0)-(y.ts||0));if(view==="shop"||view==="owner")render()});
  S.sub("meta",l=>{const m=l.find(x=>x.id==="reset");resetAt=m&&m.at||0;const h=l.find(x=>x.id==="hero");heroPh=h&&h.photo||"";recompute();if(view==="shop"&&profile)render()});
  const oi=l=>{idxDocs=l;recompute()},fo=l=>{fbDocs=l;recompute()};
  if(mode==="online"){
   FB.onAuthStateChanged(FB.auth,u=>{
    unsubs.forEach(f=>f());unsubs=[];fbUser=u||null;
    isOwner=!!u&&!!u.email&&u.email.toLowerCase()===OWNER_EMAIL.toLowerCase();
    uid=u?u.uid:null;profile=u&&!isOwner?lsGet(pk("profile"),null):null;idxDocs=[];fbDocs=[];
    if(u){if(isOwner){unsubs.push(S.sub("orderIndex",oi),S.sub("feedback",fo));view="owner"}else unsubs.push(S.subDoc("orderIndex",u.uid,oi),S.subDoc("feedback",u.uid,fo))}
    else{view="shop";FB.signInAnonymously(FB.auth).catch(e=>{authErr=(e&&e.code)||"error";banner();render()})}
    recompute();render()},e=>{authErr=(e&&e.code)||"error";banner();render()});
  }else{S.sub("orderIndex",oi);S.sub("feedback",fo)}
 }catch(e){
  console.error(e);mode="local";
  const b=$("#ban");b.style.display="block";b.textContent="Startup error: "+(e&&e.message||e);
 }
 booting=false;render();
})();
</script></body></html>
